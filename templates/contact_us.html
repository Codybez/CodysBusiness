<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='login.css') }}"
    />
    <style>
      * {
        font-family: "Poppins", sans-serif !important;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #ffffff;
        margin-bottom: 60px;
        padding: 20px;
        margin-top: 20px;
      }

      .contact-container {
        background-color: #ffffff;
        padding: 30px 25px;
        border-radius: 16px;
        width: 100%;
        max-width: 420px;
      }

      .contact-container h1 {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: left;
        margin-bottom: 4px;
      }

      .contact-container h1 span {
        color: #ff6600;
      }

      .contact-subtitle {
        font-size: 13px;
        color: #888;
        margin-bottom: 28px;
        text-align: left;
      }

      .contact-container label {
        font-size: 13px;
        color: #555;
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
      }

      .contact-container input[type="text"],
      .contact-container input[type="email"],
      .contact-container textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        margin-bottom: 16px;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        font-size: 14px;
        color: #333;
        outline: none;
        transition:
          border 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out;
        background-color: #fafafa;
      }

      .contact-container input:focus,
      .contact-container textarea:focus {
        border-color: #ff6600;
        box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1);
        background-color: #fff;
      }

      .contact-container textarea {
        resize: none;
      }

      .contact-container button {
        background-color: #ff6600;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        padding: 13px;
        width: auto;
        min-width: 120px;
        display: block;
        margin: 0 auto;
        border-radius: 25px;
        cursor: pointer;
        transition: background-color 0.3s ease-in-out;
      }

      .contact-container button:hover {
        background-color: #e55a00;
      }

      .contact-container p {
        text-align: center;
        font-size: 14px;
        color: #555;
        margin-top: 15px;
      }

      .contact-container a {
        color: #ff6600;
        text-decoration: none;
        font-weight: bold;
      }

      .contact-container a:hover {
        color: #e55a00;
      }

      .form-start {
        margin-top: 10px;
      }
      i[class^="fa"],
      i[class*=" fa"] {
        font-family: "Font Awesome 6 Free" !important;
      }
    </style>
  </head>
  <body>
    {% if current_user.business_profile %} {% extends 'base_business.html' %} {%
    else %} {% extends 'base_labour.html' %} {% endif %} {% block title
    %}Contact Form{% endblock %} {% block content %}
    <div class="contact-container">
      <form method="POST" action="{{ url_for('contact') }}">
        <div>
          <h1><span>Contact Us.</span></h1>
          <p class="contact-subtitle">
            We'll get back to you as soon as possible.
          </p>
        </div>

        <!-- Name Input -->
        <div class="form-start">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            value="{{ current_user.first_name }} {{ current_user.last_name }}"
          />
        </div>

        <!-- Email Input -->
        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            value="{{ current_user.email }}"
          />
        </div>

        <!-- Message Input -->
        <div>
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            required
            placeholder="Your Message"
            rows="10"
            style="font-family: Arial, Helvetica, sans-serif"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" id="submit-button">Send Message</button>
        </div>
      </form>
    </div>
    {% endblock %}
  </body>
</html>
