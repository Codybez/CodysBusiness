<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='app_images/icon-image.png') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #ffffff;
      }

      .registration-container {
        background-color: #ffffff;
        border-radius: 15px;
        max-width: 400px;
        min-width: 300px;
      }

      .registration-container h1 {
        font-size: 20px;
        color: #ff6600;
        text-align: left;
        margin-bottom: 10px;
      }

      .registration-container input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #cccccc;
        border-radius: 5px;
        font-size: 17px;
        outline: none;
        font-family: "Poppins", sans-serif;
      }

      .registration-container input:focus {
        border-color: #ff6600;
        box-shadow: 0 0 5px rgba(255, 113, 72, 0.3);
      }

      .registration-container button {
        background-color: #ff6600;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        border: none;
        padding: 8px 16px;
        border-radius: 25px;
        cursor: pointer;
        display: block;
        margin: 0 auto;
      }

      .registration-container button:hover {
        background-color: #ff5e33;
      }
    </style>
  </head>

  <body>
    {% extends 'base.html' %} {% block title %}Forgot Form{% endblock %} {%
    block content %}
    <div class="registration-container">
      <h1>Set New Password</h1>

      <form method="POST">
        <input
          type="password"
          name="password"
          placeholder="New password"
          required
        />

        <button type="submit">Update Password</button>
      </form>
    </div>
    {% endblock %}
  </body>
</html>
