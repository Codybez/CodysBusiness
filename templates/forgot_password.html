
    <style>


      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #ffffff;
      }

      .registration-container {
        background-color: #ffffff;
        border-radius: 15px;
        max-width: 400px;
        min-width: 300px;
      }

      .registration-container h1 {
        font-size: 20px;
        color: #ff6600;
        text-align: left;
        margin-bottom: 10px;
      }

      .registration-container input[type="email"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #cccccc;
        border-radius: 5px;
        font-size: 17px;
        outline: none;
        font-family:
          "Poppins", sans-serif 
      }

      .registration-container input:focus {
        border-color: #ff6600;
        box-shadow: 0 0 5px rgba(255, 113, 72, 0.3);
      }

      .registration-container button {
        background-color: #ff6600;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        border: none;
        padding: 8px 16px;
        border-radius: 25px;
        cursor: pointer;
        display: block;
        margin: 0 auto;
      }

      .registration-container button:hover {
        background-color: #ff5e33;
      }

      .registration-container p {
        text-align: center;
        font-size: 14px;
        color: #555;
        margin-top: 15px;
      }

      .registration-container a {
        color: #ff6600;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    {% extends 'base.html' %} {% block title %}Reset{% endblock %} {% block
    content %}
    <div class="registration-container">
      <h1>Reset Password</h1>

      <form method="POST">
        <input
          type="email"
          name="email"
          placeholder="Enter your email"
          required
        />

        <button type="submit">Send Reset Link</button>
      </form>

      <p>
        Back to
        <a href="{{ url_for('login') }}">Login</a>
      </p>
    </div>
    {% endblock %}
  </body>
</html>
